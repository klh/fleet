config_version = "0"

# Fleet root (W422.11): mirrors packages/suspenders/.qlty/qlty.toml plugins
# plus monorepo-level excludes. Without a root .qlty/ the qlty CLI resolves
# the repo root, finds nothing, and the on-write gate silently no-ops.
exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/fixtures/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  ".fleet/**",
  ".worktrees/**",
  "packages/blam/dataset/**",
  "packages/blam/paper/**",
  # W749: byte-sealed arena tasks — hashes pinned in MANIFEST.json, never reformat
  "packages/belt/bench/arena/tasks/**",
  # W792: byte-sealed review-arena tasks — same law
  "packages/belt/bench/arena/review-seal/**",
  # W823: byte-sealed external (FRAMES) slice + raw source snapshot — same law
  "packages/belt/bench/arena/tasks-ext/**",
  "packages/belt/bench/arena/ext-raw/**",
  # W950: vendored dosu-ai/decant snapshot @ v0.11.0 — upstream-owned bytes,
  # never reformatted in place. The WHOLE tree is excluded from the ROOT qlty
  # config: decant ships its own biome.json (a second biome root — a root-level
  # run conflicts), and the adapter layer in packages/decant/fleet/ is linted
  # through THAT config (the on-write gate runs qlty from the edited file's
  # dir, so the nearest-config discovery picks decant's rules).
  # W1303.1.10: whole-tree glob — the per-dir rows above let top-level files
  # (package.json) fall through to the root biome run, which hard-errors on
  # the nested biome root and reports a parser error against the file.
  "packages/decant/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

