# W1013 ChatGPT auto-coordinate config (notify.yaml-class keys).
# Machine-level ONLY — ~/.config/klh/chatgpt-coordinate.yaml (mode 600;
# KLH_CHATGPT_COORDINATE overrides the path). The config IS the opt-in:
# no file = the runner idles. Ops kill switches: `SUSPENDERS_CHATGPT_COORD=0`
# or the marker file `<repo>/.fleet/chatgpt-auto-paused`.
enabled: true # master gate — false/absent = idle
target: "" # ChatGPT plane sid; empty = the --best ranked-expert ask
board_url: http://127.0.0.1:7799 # the W931 ingress board base
write_token_file: ~/.cache/claude-governor/write-token # 0600, never typed
asker_sid: chatgpt-auto # the runner's plane identity (external session row)
dedupe_s: 3600 # one ask per request identity per hour (W947 pattern)
failed_relaunches: 2 # work.failed events per item before the ask fires
brief_max_lines: 80 # the brief hard cap
triggers: # which fleet signals become co-supervisor asks
  need_decision: true # NEED_DECISION events
  failed_relaunch: true # an item failed after >= failed_relaunches runs
  bench_row: true # a benchmarks.md row landed
