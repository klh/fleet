<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1115 806" font-family="Geneva, Verdana, sans-serif"><rect width="100%" height="100%" fill="#fff"/><line x1="95" y1="30" x2="95" y2="806" stroke="#999" stroke-dasharray="3 3"/><line x1="280" y1="30" x2="280" y2="806" stroke="#999" stroke-dasharray="3 3"/><line x1="465" y1="30" x2="465" y2="806" stroke="#999" stroke-dasharray="3 3"/><line x1="650" y1="30" x2="650" y2="806" stroke="#999" stroke-dasharray="3 3"/><line x1="835" y1="30" x2="835" y2="806" stroke="#999" stroke-dasharray="3 3"/><line x1="1020" y1="30" x2="1020" y2="806" stroke="#999" stroke-dasharray="3 3"/><g><rect x="11.5" y="6" width="167" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="95" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Lane (worker session)</text></g><g><rect x="203.5" y="6" width="153" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="280" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Coordinator session</text></g><g><rect x="367.5" y="6" width="195" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="465" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">governor.db (bus + graph)</text></g><g><rect x="566.5" y="6" width="167" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="650" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Fleet board (browser)</text></g><g><rect x="748" y="6" width="174" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="835" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">advise.ts (LLM worker)</text></g><g><rect x="961" y="6" width="118" height="24" rx="3" fill="#f3f3f0" stroke="#8a8a96"/><text x="1020" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Human operator</text></g><g><rect x="95" y="48" width="370" height="20" fill="#f6f4ea" stroke="#b8b39a"/><text x="280" y="61.5" text-anchor="middle" font-size="11" font-style="italic" fill="#333">work and checkpoints are structured events in the database</text></g><g><line x1="95" y1="92" x2="456" y2="92" stroke="#333"/><path d="M 448 88 L 456 92 L 448 96" fill="none" stroke="#333"/><text x="280" y="87" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">1. work take W7 (CAS claim, capability-checked)</text></g><g><line x1="95" y1="122" x2="456" y2="122" stroke="#333"/><path d="M 448 118 L 456 122 L 448 126" fill="none" stroke="#333"/><text x="280" y="117" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">2. emit checkpoint --sha (milestone)</text></g><g><line x1="95" y1="152" x2="456" y2="152" stroke="#333"/><path d="M 448 148 L 456 152 L 448 156" fill="none" stroke="#333"/><text x="280" y="147" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">3. emit NEED_DECISION (decision raised)</text></g><g><line x1="465" y1="182" x2="641" y2="182" stroke="#333"/><path d="M 633 178 L 641 182 L 633 186" fill="none" stroke="#333"/><text x="557.5" y="177" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">4. 1s poll — decision card (red, asker, age)</text></g><g><line x1="650" y1="212" x2="1011" y2="212" stroke="#333"/><path d="M 1003 208 L 1011 212 L 1003 216" fill="none" stroke="#333"/><text x="835" y="207" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">5. "2 decisions need you"</text></g><g><line x1="1020" y1="264" x2="659" y2="264" stroke="#333"/><path d="M 667 260 L 659 264 L 667 268" fill="none" stroke="#333"/><text x="835" y="259" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">6. click "Get recommendation"</text></g><g><line x1="650" y1="294" x2="826" y2="294" stroke="#333"/><path d="M 818 290 L 826 294 L 818 298" fill="none" stroke="#333"/><text x="742.5" y="289" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">7. POST /api/advise (spawn, detached)</text></g><g><line x1="835" y1="324" x2="474" y2="324" stroke="#333"/><path d="M 482 320 L 474 324 L 482 328" fill="none" stroke="#333"/><text x="650" y="319" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">8. read claims, recent events, graph shape</text></g><g><path d="M 835 348 h 30 v 12 h -22" fill="none" stroke="#333"/><path d="M 849 356 L 843 360 L 849 364" fill="none" stroke="#333"/><text x="873" y="359" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="start">9. LLM call (OpenAI-compatible, autodiscovered)</text></g><g><line x1="835" y1="386" x2="474" y2="386" stroke="#333"/><path d="M 482 382 L 474 386 L 482 390" fill="none" stroke="#333"/><text x="650" y="381" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">10. fact advice.#id + ADVICE event</text></g><g><line x1="465" y1="416" x2="641" y2="416" stroke="#333"/><path d="M 633 412 L 641 416 L 633 420" fill="none" stroke="#333"/><text x="557.5" y="411" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">11. recommendation inline (rec / rationale / risk / model)</text></g><g><line x1="650" y1="446" x2="1011" y2="446" stroke="#333"/><path d="M 1003 442 L 1011 446 L 1003 450" fill="none" stroke="#333"/><text x="835" y="441" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">12. "use" fills the answer field</text></g><rect x="50" y="226" width="1015" height="242" fill="none" stroke="#999" stroke-dasharray="2 2"/><g><rect x="50" y="226" width="230" height="16" fill="#f3f3f0" stroke="#999"/><text x="58" y="238" font-size="10.5" fill="#333">alt · human wants machine advice</text></g><g><line x1="1020" y1="476" x2="659" y2="476" stroke="#333"/><path d="M 667 472 L 659 476 L 667 480" fill="none" stroke="#333"/><text x="835" y="471" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">13. edit decision, send</text></g><g><line x1="650" y1="506" x2="474" y2="506" stroke="#333"/><path d="M 482 502 L 474 506 L 482 510" fill="none" stroke="#333"/><text x="557.5" y="501" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">14. emit ANSWER --to lane (auto-acks the decision)</text></g><g><line x1="465" y1="536" x2="104" y2="536" stroke="#333"/><path d="M 112 532 L 104 536 L 112 540" fill="none" stroke="#333"/><text x="280" y="531" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">15. lane inbox sees ANSWER on next poll</text></g><g><rect x="95" y="552" width="185" height="20" fill="#f6f4ea" stroke="#b8b39a"/><text x="187.5" y="565.5" text-anchor="middle" font-size="11" font-style="italic" fill="#333">consults — one agent asks another a question</text></g><g><line x1="95" y1="596" x2="456" y2="596" stroke="#333"/><path d="M 448 592 L 456 596 L 448 600" fill="none" stroke="#333"/><text x="280" y="591" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">16. coord who-knows "retry contracts?"</text></g><g><line x1="465" y1="626" x2="289" y2="626" stroke="#333"/><path d="M 297 622 L 289 626 L 297 630" fill="none" stroke="#333"/><text x="372.5" y="621" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">17. consult C## in expert inbox</text></g><g><line x1="280" y1="656" x2="456" y2="656" stroke="#333"/><path d="M 448 652 L 456 656 L 448 660" fill="none" stroke="#333"/><text x="372.5" y="651" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">18. coord consult-reply C## answer</text></g><g><line x1="465" y1="686" x2="104" y2="686" stroke="#333"/><path d="M 112 682 L 104 686 L 112 690" fill="none" stroke="#333"/><text x="280" y="681" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">19. answer lands in lane inbox</text></g><g><rect x="465" y="702" width="555" height="20" fill="#f6f4ea" stroke="#b8b39a"/><text x="742.5" y="715.5" text-anchor="middle" font-size="11" font-style="italic" fill="#333">zombie detection — two stale signals alert; reclaim is human</text></g><g><line x1="465" y1="746" x2="641" y2="746" stroke="#333"/><path d="M 633 742 L 641 746 L 633 750" fill="none" stroke="#333"/><text x="557.5" y="741" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">20. zombie chip (lane frozen by usage cliff)</text></g><g><line x1="1020" y1="776" x2="474" y2="776" stroke="#333"/><path d="M 482 772 L 474 776 L 482 780" fill="none" stroke="#333"/><text x="742.5" y="771" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">21. work reclaim W4 — re-dispatch at frozen transcript</text></g></svg>