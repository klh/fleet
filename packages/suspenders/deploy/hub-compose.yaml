# deploy/hub-compose.yaml — ONE hub, parameterized (W310). The reusable unit
# of the start-topology: a local user runs several hubs; each hub's compose is
# this file with a different env section. Desktop example (deploy/README.md):
#   HUB_NAME=desktop docker compose -p klh-hub-desktop up -d
# NAS example: the same file on nas.threads.dk with the NAS section.
#
# Laws inherited from sim/compose.yaml (W162):
#   - signing keys + identity data never leave hub volumes (owner law):
#     buckle secrets auto-generate inside the hub-secrets volume at first
#     boot and are never baked into images or committed.
#   - loopback binds preserved in-code; SUSPENDERS_BIND / BUCKLE_BIND decide
#     the exposure per hub (loopback-only on Desktop, LAN on the NAS board).
#   - repos bind-mount READ-ONLY; containers write only into volumes.
#   - no registry pushes: oven/bun base + bind mounts only.
#
# Enterprise layer (private overlays, config-over-code): real hub names,
# peers, Entra/OIDC values live in ~/.config/klh/stack.yaml (mode 600, never
# committed — placeholders in deploy/stack.example.yaml). The envs below are
# the materialized knobs those profiles set; W191 OIDC enforcement is base
# code — the profile only flips it.

name: klh-hub-${HUB_NAME:-desktop}

# W451 hub longevity: bounded json-file logs + memory ceilings. Rotation caps
# unbounded log growth on long-lived hubs; a leaking service degrades only
# itself, never the device. Values are code-level defaults.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# W697 container hardening (toto-gpt gap 8). Two profiles, pinned by
# test/hub-compose-hardening.test.ts:
#   - RUNTIME (every long-lived service): non-root uid, read-only rootfs,
#     tmpfs /tmp as the ONLY scratch, all capabilities dropped,
#     no-new-privileges, init (forwards SIGTERM + reaps), pids cap, and a
#     stop_grace_period sized to the service. Writable surface = its named
#     state volume only (mounted explicitly, re-owned by hub-init below).
#   - BUILD one-shots (fleet-repo, fleet-deps): root inside the container
#     (they own the code volume), still cap_drop ALL + no-new-privileges; NOT
#     read-only — git/bun write caches under $HOME — and never a serving
#     surface (they exit).
# Uid/gid are config-over-code: HUB_RUN_UID/HUB_RUN_GID (default 1000 = the
# oven/bun image's `bun` user).
#
# Liveness vs readiness vs drain:
#   - LIVENESS = compose healthcheck on the *-health sidecars (outside-process
#     probes; a wedged service cannot paint itself healthy).
#   - ROUTE CATALOG = buckle-ready's authenticated model-list check, without
#     inference tokens. Provider quota and inference availability are unknown
#     until measured by real traffic; this check never restarts the gate.
#   - DRAIN = SIGTERM -> stop_grace_period -> SIGKILL. buckle-hub's grace
#     covers the ledger ring (flushMs 5s + bounded close() drain passes) so
#     queued audit/usage rows land before the kill; sidecars hold no state.
x-run-as: &run-as "${HUB_RUN_UID:-1000}:${HUB_RUN_GID:-1000}"
x-cap-drop: &cap-drop [ALL]
x-no-new-privs: &no-new-privs ["no-new-privileges:true"]
x-tmp: &tmp-tmpfs ["/tmp:size=64m,mode=1777"]

# Runtime profile as one merge-key fragment: non-root, read-only rootfs,
# no caps, no privilege gain, init for signal forwarding + zombie reaping.
x-runtime-hardening: &runtime-hardening
  user: *run-as
  read_only: true
  tmpfs: *tmp-tmpfs
  cap_drop: *cap-drop
  security_opt: *no-new-privs
  init: true
  pids_limit: 256
  stop_grace_period: 10s

services:
  # State-volume ownership: runtime services run non-root, but docker creates
  # fresh volumes root-owned and earlier hubs wrote them as root. This
  # one-shot re-owns ONLY entries not already the runtime uid (cheap per up);
  # stateful runtime services wait on it. Minimal caps: CHOWN to re-own,
  # DAC_OVERRIDE/FOWNER to traverse 0600/0700 entries owned by another uid.
  hub-init:
    image: alpine/git@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
    container_name: ${HUB_NAME:-desktop}-hub-init
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
          pids: 64
    entrypoint: ["sh", "-c"]
    command:
      - for d in /state/buckle /state/hub-home /state/secrets /state/belt-home /state/model-store; do find "$$d" ! -user "$$HUB_RUN_UID" -exec chown "$$HUB_RUN_UID:$$HUB_RUN_GID" {} + ; done; chmod -R u+w /state/buckle /state/hub-home /state/belt-home
    environment:
      HUB_RUN_UID: ${HUB_RUN_UID:-1000}
      HUB_RUN_GID: ${HUB_RUN_GID:-1000}
    cap_drop: *cap-drop
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: *no-new-privs
    read_only: true
    pids_limit: 64
    volumes:
      - buckle-state:/state/buckle
      - hub-state:/state/hub-home
      - hub-secrets:/state/secrets
      - belt-state:/state/belt-home
      - model-store:/state/model-store

  # One pinned Fleet checkout shared by every package. Existing state and
  # secret volumes retain their names; only the code volume is replaced.
  # BUILD profile (W697): root, but no caps / no privilege gain.
  fleet-repo:
    image: alpine/git@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
    container_name: ${HUB_NAME:-desktop}-fleet-repo
    logging: *default-logging
    cap_drop: *cap-drop
    security_opt: *no-new-privs
    pids_limit: 128
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    entrypoint: ["sh", "-c"]
    command:
      - if [ ! -d /srv/repo/.git ]; then git init /srv/repo && git -C /srv/repo remote add origin "$HUB_FLEET_REPO_URL"; fi; git -C /srv/repo remote set-url origin "$HUB_FLEET_REPO_URL" && git -C /srv/repo fetch --depth 1 origin "$HUB_FLEET_REF" && git -C /srv/repo reset --hard FETCH_HEAD
    environment:
      HUB_FLEET_REF: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_FLEET_REPO_URL: ${HUB_FLEET_REPO_URL:-https://github.com/klh/fleet.git}
    volumes:
      - fleet-repo:/srv/repo

  # W443: oven/bun:1 is the ARTIFACT runtime — every service below runs its
  # embedded SQLite (vendored amalgamation on Linux). CI (runtime-sqlite job)
  # verifies the floating tag carries the WAL-reset fix (3.51.3+) each push;
  # hubctl status reports the live verdict per hub.
  fleet-deps:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-fleet-deps
    logging: *default-logging
    cap_drop: *cap-drop
    security_opt: *no-new-privs
    pids_limit: 256
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    working_dir: /src/fleet
    # W689: boot script installs the pinned checkout AND links the base
    # monorepo's workspaces under their package names — overlay hubs run
    # base code from node_modules/fleet/packages where bun's git-dep
    # install creates no workspace links (cross-package @klh/* imports
    # would die at boot). Plain fleet checkouts run the in-tree copy;
    # overlay checkouts carry no packages/suspenders, so the
    # copy rides the installed base dep. if/else (not `&& … ||`): a
    # failing in-tree boot must NOT fall through to the dep copy (W714).
    command: sh -c "if test -f packages/suspenders/deploy/hub-deps.ts; then exec bun packages/suspenders/deploy/hub-deps.ts; else bun install --frozen-lockfile && exec bun node_modules/fleet/packages/suspenders/deploy/hub-deps.ts; fi"
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
    depends_on:
      fleet-repo:
        condition: service_completed_successfully
    volumes:
      - fleet-repo:/src/fleet

  buckle-hub:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-buckle-hub
    logging: *default-logging
    <<: *runtime-hardening
    # ledger ring flush (5s cadence) + bounded close() drain: 30s covers it
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256
    network_mode: host
    restart: unless-stopped
    working_dir: ${HUB_FLEET_SRC:-/src/fleet/packages}/buckle
    # W688.7.1: the entrypoint is machine config. Unset = the base server
    # (provider-less solo posture); an enterprise hub points HUB_BUCKLE_ENTRY
    # at the overlay entry that injects the gov providers (entitlements,
    # usage, manifest/CR, spokes) into the base startServer.
    command: bun run ${HUB_BUCKLE_ENTRY:-src/server.ts}
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
    env_file:
      # break-glass root credential (drift-never + secrets law): generated
      # ON THE HUB DEVICE, mode 600, never committed. BUCKLE_ROOT_KEY seeds
      # the bootstrap principal; mint bksk_ keys via /v1/admin/keys and
      # retire the root. Short form for compose-spec compat (older DSM
      # compose rejects the path/required long form); a MISSING file still
      # fails `up` (compose stats it before creating the service).
      - ${HUB_BUCKLE_ENV_FILE:-./buckle.env}
      # W688.7.1: ladder key values (LITELLM_KEY …) — hubctl push builds
      # this 0600 file ON the hub from stack.yaml secrets.upstream_keys paths
      - ./upstream.env
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/hub-home
      BUCKLE_PORT: ${HUB_BUCKLE_PORT:-4111}
      BUCKLE_BIND: ${HUB_BUCKLE_BIND:-127.0.0.1}
      BUCKLE_DB: /state/buckle/buckle.db
      # Stable routing identity for relay baggage and per-hop audit rows.
      BUCKLE_HUB_ID: ${HUB_NAME:-desktop}
      # W858.10.3: lane-observation outbox → projection db at <path>.db
      # (server.ts W461 stage 2; the network read model resolves the same
      # chain) — hubs project per-hub request edges for the Network overview
      BUCKLE_OBSERVATIONS_PATH: /state/buckle/observations.ndjson
      BUCKLE_POLICY: ${HUB_FLEET_SRC:-/src/fleet/packages}/buckle/routing-policy.yaml
      BUCKLE_UPSTREAMS: /etc/klh/upstreams.hub.yaml
      # W983: the hub's owner prefs (allow_cloud / cost_speed), rendered by
      # hubctl from stack.yaml `buckle_prefs:` — the switches the routing
      # decision gates every cloud hop behind. Always present (undeclared =
      # conservative defaults, cloud closed).
      BUCKLE_PREFS: /etc/klh/buckle-prefs.json
      # W688.7.1: private-network ladder legs (e.g. the host litellm via
      # host.docker.internal) — the egress law admits plain http ONLY to
      # hosts listed here; empty = loopback only (the public default)
      BUCKLE_HTTP_UPSTREAM_HOSTS: ${HUB_HTTP_UPSTREAM_HOSTS:-}
      BUCKLE_SECRETS_HOME: /state/secrets
      BUCKLE_AUTH: ${HUB_BUCKLE_AUTH:-on}
      # W372: stack.yaml auth.oidc/auth.tokens → env (Entra-ready, config-only
      # — the gate builds its JWT validator from these when present; empty =
      # base posture unchanged). Issuer/jwksUri/audience are the validator
      # contract; requiredScope + TTL ride for the identity-plane consumers.
      BUCKLE_OIDC_ISSUER: ${HUB_BUCKLE_OIDC_ISSUER:-}
      BUCKLE_OIDC_JWKS_URI: ${HUB_BUCKLE_OIDC_JWKS_URI:-}
      BUCKLE_OIDC_AUDIENCE: ${HUB_BUCKLE_OIDC_AUDIENCE:-}
      BUCKLE_OIDC_REQUIRED_SCOPE: ${HUB_BUCKLE_OIDC_REQUIRED_SCOPE:-}
      BUCKLE_AUTH_TTL_HOURS: ${HUB_BUCKLE_AUTH_TTL_HOURS:-}
      # W688.3: overlay code-loader knobs (config-over-code; empty = unset =
      # solo posture — the loader treats unset/empty exactly as before). The
      # overlay code arrives via the fleet-repo volume (an overlay hub pulls
      # its own repo); allow admits that checkout root to the loader.
      KLH_OVERLAY_DIR: ${HUB_KLH_OVERLAY_DIR:-}
      KLH_OVERLAY_SHA256: ${HUB_KLH_OVERLAY_SHA256:-}
      KLH_OVERLAY_ALLOW: ${HUB_KLH_OVERLAY_ALLOW:-}
    volumes:
      - fleet-repo:/src/fleet:ro
      # W688.7.1: the hub's real upstream ladder, rendered by hubctl from
      # stack.yaml `upstreams:` (always present — empty groups = the
      # committed placeholder ladder stands); merged over the base file
      - ./upstreams.hub.yaml:/etc/klh/upstreams.hub.yaml:ro
      # W983: the 0600 owner-prefs file hubctl push renders from stack.yaml
      - ./buckle-prefs.json:/etc/klh/buckle-prefs.json:ro
      - buckle-state:/state/buckle
      - hub-secrets:/state/secrets

  # Health sidecars (owner law): the health verdict about a service comes
  # from a process OUTSIDE the served container — the sidecar polls the
  # target over the wire and serves the result; compose health hits the
  # sidecar. A wedged server runtime cannot paint itself healthy.
  buckle-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-buckle-health
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      buckle-hub:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BUCKLE_PORT:-4111}/status --listen ${HUB_BUCKLE_HEALTH_PORT:-4112}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_BUCKLE_HEALTH_PORT: ${HUB_BUCKLE_HEALTH_PORT:-4112}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BUCKLE_HEALTH_PORT ?? "4112") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Token-free route-catalog check: the outside-process sidecar authenticates
  # to Buckle and asserts the configured model is listed. This proves the gate
  # and route config answer over the wire, but provider quota/inference remain
  # unknown until real traffic measures them. INFORMATIONAL surface: hubctl
  # status reports it; compose health still hits buckle-health.
  # HUB_READY_MODEL is machine-level config (stack.yaml) — it must name a
  # model the hub's routing ladder actually serves.
  buckle-ready:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-buckle-ready
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      buckle-hub:
        condition: service_started
    command:
      - bun
      - ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts
      - --target
      - http://127.0.0.1:${HUB_BUCKLE_PORT:-4111}/v1/models
      - --listen
      - ${HUB_BUCKLE_READY_PORT:-4113}
      - --auth-env
      - BUCKLE_ROOT_KEY
      - --catalog-model
      - ${HUB_READY_MODEL:-general}
      - --every
      - ${HUB_READY_EVERY_MS:-600000}
      - --timeout
      - ${HUB_READY_TIMEOUT_MS:-30000}
      - --misses
      - "2"
    env_file:
      # the catalog read rides the same break-glass root credential as
      # the gate (buckle.env, 0600, never transported)
      - ${HUB_BUCKLE_ENV_FILE:-./buckle.env}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_BUCKLE_READY_PORT: ${HUB_BUCKLE_READY_PORT:-4113}
    volumes:
      - fleet-repo:/src/fleet:ro

  board-hub:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-board-hub
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256
    network_mode: host
    restart: unless-stopped
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/hooks/bin/fleet-board.ts --port ${HUB_BOARD_PORT:-7809}
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/hub-home
      # the healthcheck reads the port from the container env — export what
      # the command flag resolved to, or the probe hits the default and
      # the service is forever "unhealthy" (the NAS cutover lesson)
      HUB_BOARD_PORT: ${HUB_BOARD_PORT:-7809}
      SUSPENDERS_BIND: ${HUB_BOARD_BIND:-127.0.0.1}
      SUSPENDERS_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:-suspenders.local}
      # LAN service-discovery feed (recovery map); unset/empty = none
      SUSPENDERS_SERVICES_JSON: ${HUB_SERVICES_JSON:-}
    volumes:
      - fleet-repo:/src/fleet:ro
      - hub-state:/state/hub-home
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
      store-health:
        condition: service_healthy

  board-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-board-health
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      board-hub:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BOARD_PORT:-7809}/status --listen ${HUB_BOARD_HEALTH_PORT:-7800}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_BOARD_HEALTH_PORT: ${HUB_BOARD_HEALTH_PORT:-7800}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BOARD_HEALTH_PORT ?? "7800") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  store-hub:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME}-store-hub
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256
    network_mode: host
    restart: unless-stopped
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/hooks/bin/store-server.ts --port ${HUB_STORE_PORT:-7796}
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/hub-home
      # same healthcheck-port law as board-hub: export the resolved port
      HUB_STORE_PORT: ${HUB_STORE_PORT:-7796}
    volumes:
      - fleet-repo:/src/fleet:ro
      - hub-state:/state/hub-home

  store-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-store-health
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      store-hub:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_STORE_PORT:-7796}/status --listen ${HUB_STORE_HEALTH_PORT:-7794}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_STORE_HEALTH_PORT: ${HUB_STORE_HEALTH_PORT:-7794}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_STORE_HEALTH_PORT ?? "7794") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  belt-hub:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-belt-hub
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256
    ports:
      - "${HUB_BELT_BIND:-127.0.0.1}:${HUB_BELT_PORT:-7792}:7791"
    restart: unless-stopped
    command: sh -c 'mkdir -p /state/belt-home/.claude/local-llm /state/belt-home/.claude-insights && exec bun ${HUB_FLEET_SRC:-/src/fleet/packages}/belt/bin/dashboard.ts'
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/belt-home
      BELT_PORT: "7791"
    volumes:
      - fleet-repo:/src/fleet:ro
      - belt-state:/state/belt-home

  belt-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-belt-health
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      belt-hub:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BELT_PORT:-7792}/api/status --listen ${HUB_BELT_HEALTH_PORT:-7790}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_BELT_HEALTH_PORT: ${HUB_BELT_HEALTH_PORT:-7790}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BELT_HEALTH_PORT ?? "7790") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Belt-owned model wire. A machine profile selects the upstream;
  # its live /v1/models response supplies inventory, without model IDs here.
  belt-model:
    profiles: [belt-model]
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-belt-model
    logging: *default-logging
    <<: *runtime-hardening
    network_mode: host
    restart: unless-stopped
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/belt/bin/model-proxy.ts
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      BELT_MODEL_PORT: ${HUB_BELT_MODEL_PORT:-8914}
      BELT_MODEL_UPSTREAM: ${HUB_BELT_MODEL_UPSTREAM:-}
    volumes:
      - fleet-repo:/src/fleet:ro

  belt-model-health:
    profiles: [belt-model]
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-belt-model-health
    logging: *default-logging
    <<: *runtime-hardening
    network_mode: host
    restart: unless-stopped
    depends_on:
      belt-model:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BELT_MODEL_PORT:-8914}/v1/models --listen ${HUB_BELT_MODEL_HEALTH_PORT:-8915}
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_BELT_MODEL_HEALTH_PORT: ${HUB_BELT_MODEL_HEALTH_PORT:-8915}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BELT_MODEL_HEALTH_PORT ?? "8915") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # W763 hub model store: content-addressed blobs + catalog sync
  # (belt/bin/model-store.ts). Pull auth = the hub's OWN buckle ledger
  # (shared buckle.db WAL — the face mints nothing, fails closed 503
  # without it); sync-on-boot: peer first (owned links beat origin egress),
  # then the public origin. Peer URL/token are operator knobs appended to
  # the hub's 0600 .env by hand (render stays no-secrets).
  model-store-hub:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-model-store-hub
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256
    network_mode: host
    restart: unless-stopped
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/belt/bin/model-store.ts serve
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/hub-home
      MODEL_STORE_ROOT: /state/model-store
      MODEL_STORE_PORT: ${HUB_MODEL_STORE_PORT:-7797}
      MODEL_STORE_BIND: ${HUB_MODEL_STORE_BIND:-127.0.0.1}
      BUCKLE_DB: /state/buckle/buckle.db
      MODEL_STORE_PEER_URL: ${HUB_MODEL_STORE_PEER_URL:-}
      MODEL_STORE_PEER_TOKEN: ${HUB_MODEL_STORE_PEER_TOKEN:-}
      MODEL_STORE_HF_TOKEN: ${HUB_MODEL_STORE_HF_TOKEN:-}
      MODEL_STORE_SYNC_ON_BOOT: "1"
    volumes:
      - fleet-repo:/src/fleet:ro
      - model-store:/state/model-store
      - buckle-state:/state/buckle

  model-store-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-model-store-health
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    depends_on:
      model-store-hub:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_MODEL_STORE_PORT:-7797}/health --listen ${HUB_MODEL_STORE_HEALTH_PORT:-7801}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_MODEL_STORE_HEALTH_PORT: ${HUB_MODEL_STORE_HEALTH_PORT:-7801}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_MODEL_STORE_HEALTH_PORT ?? "7793") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # W854: mDNS advertisement — the hub announces ITSELF on the LAN
  # (_klh-hub._tcp, instance = HUB_NAME). hub-locate's dns-sd discovery leg
  # browses this exact service type; until now the browse came back EMPTY.
  # Pure-TS announcer on the pinned bun image (no new container image, no
  # native deps); host networking puts the announcements on the LAN
  # interface. The announcer serves its real state on HUB_MDNS_HEALTH_PORT;
  # compose health hits the OUTSIDE-PROCESS mdns-health sidecar (owner law).
  # An undetectable/undeclared HUB_MDNS_ADDR skips the A record — the hub
  # is never advertised as 127.0.0.1 to the LAN.
  mdns-announce:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-mdns-announce
    logging: *default-logging
    <<: *runtime-hardening
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
    network_mode: host
    restart: unless-stopped
    depends_on:
      buckle-health:
        condition: service_healthy
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/mdns/announce.ts
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /tmp
      HUB_MDNS_LABEL: ${HUB_NAME:-desktop}
      HUB_MDNS_PORT: ${HUB_MDNS_PORT:-${HUB_BUCKLE_PORT:-4111}}
      HUB_MDNS_ADDR: ${HUB_MDNS_ADDR:-}
      HUB_MDNS_HOSTNAME: ${HUB_MDNS_HOSTNAME:-}
      HUB_MDNS_INTERVAL_MS: ${HUB_MDNS_INTERVAL_MS:-}
      HUB_MDNS_HEALTH_PORT: ${HUB_MDNS_HEALTH_PORT:-4114}
    volumes:
      - fleet-repo:/src/fleet:ro

  # The verdict about the announcer comes from a process outside it —
  # probe.ts polls the announcer's self-report over the wire and serves the
  # degrade-on-miss verdict; compose health hits THIS sidecar.
  mdns-health:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-mdns-health
    logging: *default-logging
    <<: *runtime-hardening
    pids_limit: 128
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
    network_mode: host
    restart: unless-stopped
    depends_on:
      mdns-announce:
        condition: service_started
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_MDNS_HEALTH_PORT:-4114}/healthz --listen ${HUB_MDNS_SIDECAR_PORT:-4115}
    environment:
      HOME: /tmp
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HUB_MDNS_SIDECAR_PORT: ${HUB_MDNS_SIDECAR_PORT:-4115}
    volumes:
      - fleet-repo:/src/fleet:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_MDNS_SIDECAR_PORT ?? "4115") + "/healthz"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # W362 peer policy propagation — the hub pulls each declared peer's
  # /federation/policy-manifest (labels from HUB_PEERS, hosts/ports/keys
  # resolved over the network at runtime). The content-addressed manifest
  # version is the change detector; a peer that is down degrades one cycle
  # (last-known kept), never the hub. Peer auth = a spoke-scoped key minted
  # on the peer, carried per label in the hub-home registry (hubs.json).
  peer-pull:
    image: oven/bun:1@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    container_name: ${HUB_NAME:-desktop}-peer-pull
    logging: *default-logging
    <<: *runtime-hardening
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 256
    network_mode: host
    restart: unless-stopped
    command: bun ${HUB_FLEET_SRC:-/src/fleet/packages}/suspenders/hooks/bin/federation-peers.ts
    depends_on:
      fleet-deps:
        condition: service_completed_successfully
      hub-init:
        condition: service_completed_successfully
    environment:
      FLEET_VERSION: ${HUB_FLEET_REF:?pin a reviewed Fleet SHA or release tag}
      HOME: /state/hub-home
      KLH_HUB_NAME: ${HUB_NAME:-desktop}
      HUB_PEERS: ${HUB_PEERS:-}
      FEDERATION_PEERS_INTERVAL_S: ${FEDERATION_PEERS_INTERVAL_S:-300}
    volumes:
      - fleet-repo:/src/fleet:ro
      - hub-state:/state/hub-home

volumes:
  fleet-repo:
  buckle-state:
  hub-state:
  hub-secrets:
  belt-state:
  model-store:
