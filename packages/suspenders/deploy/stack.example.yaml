# deploy/stack.example.yaml — placeholder runtime config for a hub (W310).
# Copy the shape to ~/.config/klh/stack.yaml (mode 600) and fill real values.
# REAL hosts, keys, tokens, Entra tenant data NEVER go in committed files —
# the overlay law: config-over-code, placeholders only in repos.

# The start-topology: a local user defines several hubs; each hub may declare
# peers (its own sub-hubs). The graph is data, never hardcoded.
hubs:
  desktop:
    host: 127.0.0.1
    display_name: Workstation hub # optional UI label; desktop remains the stable id
    buckle_port: 4111
    board_port: 7809
    store_port: 7796
    belt_port: 7808 # local hub; keep distinct from belt.local, bar.local, belt-mcp.local
    # health sidecar serve ports (W422.10) — optional; undeclared knobs
    # fall through to the hub-compose.yaml template defaults
    buckle_health_port: 4112
    board_health_port: 7800
    store_health_port: 7794
    belt_health_port: 7790
    allowed_hosts: [suspenders.local]
    peers: [] # sub-hubs of this hub, filled at runtime
    # Display intent only: puts pending provider cards beside this hub.
    # It never enables a route, credential, or connection line.
    provider_intents: [anthropic, openai, openrouter]
    # Direct cloud providers on this hub are activated only after their
    # credential files exist and the operator has verified a model id. Do not
    # declare upstream_keys without files: hubctl push intentionally refuses
    # a missing key. Do not declare groups before then: they would look like
    # exposed models in the network overview. See
    # docs/design/buckle/muramasa-provider-activation.md for the exact rows.
    # To expose every currently free text model from OpenRouter, provision a
    # limited inference API key for the local LiteLLM engine first. A
    # management key cannot serve inference. Buckle needs only its existing
    # LiteLLM master key. Then set buckle_prefs.allow_cloud: true and:
    # secrets:
    #   upstream_keys:
    #     LITELLM_KEY: /path/on/hub/litellm.key
    # upstreams:
    #   openrouter_free_catalog_file: /absolute/machine/path/openrouter-free.desktop.json
    # Refresh that snapshot with:
    #   bun deploy/openrouter-free-sync.ts sync --output /absolute/machine/path/openrouter-free.desktop.json
    # hubctl reload-upstreams desktop merges the generated Buckle routes
    # below any explicit groups and recreates only Buckle. The local
    # LiteLLM :4100 config must also contain those model_names and its
    # supervisor must receive OPENROUTER_API_KEY from a 0600 machine file.
  nas:
    host: nas.example # $NAS_HOST — real value in runtime stack.yaml only
    buckle_port: 4101
    board_port: 7799
    store_port: 7795
    belt_port: 7791
    buckle_health_port: 4111
    board_health_port: 7798
    store_health_port: 7793
    belt_health_port: 7789
    allowed_hosts: [nas-hub.local]
    peers:
      - desktop # first topology edge (W322): nas declares desktop as peer.
        # Hub LABELS only — hosts/ports/keys resolve at runtime from the
        # real stack.yaml; an overlay hub profile mirrors the edge as
        # federation.peers.
    # deployment knobs (hubctl, deploy/hubctl.ts): binds + repo trees +
    # deploy transport + secret PATHS (values minted on the hub, never here)
    bind: 0.0.0.0
    board_bind: 0.0.0.0
    belt_bind: 0.0.0.0
    services_json: /state/hub-home/services.json
    # deploy source (W422.7 mono deploy): ONE monorepo origin for all
    # packages + a ref pin; `src` is the packages root inside
    # the clone hub services run from (an overlay monorepo — private tier —
    # resolves its pinned public base under node_modules/<dep>/packages).
    repos:
      # the ref the hub pulls: the stack version on the public origin;
      # an overlay origin (private tier) sets its OWN deployable ref here —
      # the 40-hex stack version cannot be a ref in a private origin (GH002);
      # the public base rides the version via the overlay's git-dep pins.
      ref: 0123456789abcdef0123456789abcdef01234567
      # ONE shared monorepo origin, on any of the named keys (must agree);
      # unset = https://github.com/klh/fleet.git. A private-tier overlay
      # monorepo sets its origin here + src to its node_modules base root.
      buckle: https://example.invalid/mirror/fleet.git
      src: /src/fleet/node_modules/fleet/packages
    deploy:
      ssh: user@nas.example
      connect_timeout: 10 # seconds; ssh/scp ConnectTimeout (BatchMode always on)
      dir: /volume1/docker/hub
      docker: /usr/local/bin/docker
    secrets:
      buckle_root_key: /volume1/docker/hub/buckle/buckle.env
    # W1124.15: optional — PATH on THIS device to the 0600 env file holding
    # the PERSISTENT proxy-only service credential this device's spoke links
    # use toward the hub (never the root key, never an expiring lane key).
    # hubctl deploy verifies it against the hub's verify API and fails with
    # the hub's actual expired/revoked code. Mint:
    #   hubctl mint-service-key <hub> --name <service-name> --out <file>
    # When that file carries several variables (spoke env files start with
    # the ROOT key), name the one to verify:
    #   buckle_service_key_env: BUCKLE_SERVICE_DESKTOP
    # buckle_service_key: /path/on/this/device/desktop-service.env
    # W983: this hub's Buckle owner prefs (hubctl renders the 0600
    # buckle-prefs.json the container mounts at BUCKLE_PREFS) — the
    # allow_cloud/cost_speed switches the routing decision gates every cloud
    # hop behind. Undeclared = cloud closed, balanced.
    buckle_prefs:
      allow_cloud: false # true only where the operator wants hub cloud egress
      cost_speed: balanced # balanced | cost | speed | quality
    # W1097: managed ssh tunnel — the trusted transport THIS device uses to
    # read the hub's trace receipts (hubctl trace-tunnel nas up|status|down|
    # peer). The hub gate is plain HTTP on the LAN and the TLS front carries
    # an untrusted cert: never point the connector at the hub directly. The
    # read key rides the ssh channel; the connector fetches loopback only.
    # listen_port is on THIS device (1024-65535); target_port defaults to
    # buckle_port; read_key is a 0600 read key PATH on this device, minted
    # ON the hub — values never live in config.
    # trace_tunnel:
    #   listen_port: 14101
    #   # target_port: 4101 # default = buckle_port
    #   read_key: /path/on/this/device/nas-trace-read.key
    # W854 mDNS advertisement (_klh-hub._tcp) — all knobs optional;
    # undeclared = the compose template defaults (port ← buckle_port,
    # addr auto-detects the primary LAN IPv4, hostname = normalized label).
    # An undetectable addr SKIPS the A record — never advertise 127.0.0.1.
    mdns:
      port: 4101
      # addr: 192.0.2.50 # pin when auto-detect picks the wrong interface
      hostname: nas-hub
      interval_ms: 15000
      health_port: 4114
      sidecar_port: 4115

# Enterprise layer (the overlay knobs, materialized per hub):
auth:
  required: true
  tokens:
    ttlHours: 720 # scoped, revocable; issuance audited (W231)
  oidc:
    enforced: true # W191 requiredScope + audience enforcement (base code)
    # Entra ID values live ONLY in the real stack.yaml, never here:
    #   issuer: https://login.microsoftonline.com/$TENANT_ID/v2.0
    #   jwksUri: https://login.microsoftonline.com/$TENANT_ID/discovery/v2.0/keys
    #   audience: $APP_CLIENT_ID
    #   requiredScope: api://$APP_CLIENT_ID/access_as_user
    # W372: the whole block materializes into the hub .env (hubctl render) —
    # issuer + jwksUri + audience are REQUIRED together; a partial block
    # fails closed at render, and the buckle gate builds its JWT validator
    # from the materialized env (Entra-ready with zero code edits).
admin:
  gui: true # hub admin plane (W231)

# Registry cross-reference: ~/.claude/local-llm/hubs.json holds the
# label → candidate URLs resolveHub walks (env → repo candidates → global
# registry → mDNS <label>.local); this stack.yaml holds the values behind
# those labels. Keep the two consistent — hubs.json is the lookup,
# stack.yaml the truth.

# ── providers (W230) ──────────────────────────────────────────────────────
# The user-facing declaration of where upstream API keys live. Values NEVER
# land in committed files — this template carries placeholders only; real
# values live in the machine file (~/.config/klh/stack.yaml, mode 600) or
# the 0600 secret files it names. Resolve order: key → env → key_file.
providers:
  openai:
    env: OPENAI_API_KEY # env var NAME (resolve-time check)
  anthropic:
    key_file: ~/.claude/local-llm/belt.env # 0600 dotenv-style file
    key_name: ANTHROPIC_API_KEY # var to read (default: <PROVIDER>_API_KEY)
  openrouter:
    env: OPENROUTER_API_KEY # declaration only; no hub route without a key
  example-inline:
    key: REPLACE_ME # inline — machine file only, never commit real values

# ── executors section ─────────────────────────────────────────────────────
# Per-executor gateway base + model pin. Consumed by the insertion engine
# (suspenders lib/insertion.ts, buckle onboard + lane-wrap); env (and CLI
# flags) stay the override layer. `default` = fallback row for any id
# without its own.
executors:
  default:
    anthropic_base: http://127.0.0.1:4000 # anthropic dialect root
    openai_base: http://127.0.0.1:4100/v1 # openai dialect base incl. /v1
    model: REPLACE_ME_MODEL # pin routed by id behind belt
  claude:
    anthropic_base: http://127.0.0.1:4000
    model: REPLACE_ME_MODEL

# ── policies (W230) ───────────────────────────────────────────────────────
# Per-repo routing policy — the machine-level home for what a repo's
# .prefer dotfile expresses (dotfiles still win). `hub` only feeds dispatch
# when the repo dotfile carries no hub= line; must/prefer are W96 law
# expressions (belt router vocabulary); residency lists allowed regions
# (buckle gov vocabulary).
policies:
  fleet:
    hub: nas # dispatch fallback hub for this repo
  "*":
    prefer: local # fleet-wide default soft law
