# BUCKLE_UPSTREAMS runtime override for the e2e harness: the ladder walks
# the belt stub on the GATE'S LOOPBACK (:8902) — the real hub topology,
# where belt tiers live on the gate host's loopback (hub-compose is
# host-networked). The bridge-network harness mirrors that with belt-stub
# sharing buckle-hub's netns. Loopback = kind "local" (kindOfHost), so no
# cloud gates apply. Groups declared here win over the committed file
# (mergeUpstreams by group name).
version: 1

groups:
  glm-5.3-flash:
    - url: http://127.0.0.1:8902
      dialect: openai
      adapter: openai-compat
  local-swarm:
    - url: http://127.0.0.1:8902
      dialect: openai
      adapter: openai-compat
