# BUCKLE_UPSTREAMS runtime override for the e2e harness: the routing ladder
# walks the belt stub tier on the compose network (service DNS name), not
# the host loopback :8902 the committed default targets. Groups declared
# here win over the committed file (mergeUpstreams by group name).
version: 1

groups:
  glm-5.3-flash:
    - url: http://belt-stub:8902
      dialect: openai
      adapter: openai-compat
  local-swarm:
    - url: http://belt-stub:8902
      dialect: openai
      adapter: openai-compat
