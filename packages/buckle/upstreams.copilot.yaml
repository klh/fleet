# W695.6 — IKEA/GitHub Copilot seat as a first-class claude-* upstream.
# Operator overlay TEMPLATE: copy these groups into the machine
# BUCKLE_UPSTREAMS file (merged over upstreams.yaml by group name). Never
# committed as the active default — the seat token lives only in the env var
# named by api_key_env (GITHUB_COPILOT_PAT, resolved into buckle-spoke.env
# from the 0600 copilot.key chain; the value is never printed or committed).
#
# Wire facts (2026-10-12): api.githubcopilot.com SERVES the Anthropic
# Messages wire — POST /v1/messages answers with Bearer auth +
# Copilot-Integration-Id (quota-exhausted 429s observed live, with
# x-ratelimit-* headers; W684 verified real tool_calls on /chat/completions
# the same day). Same dialect as the lane client => byte-identical
# pass-through, no bridge, no litellm (its /v1/messages bridge hits the
# Responses API, which Copilot rejects; its github_copilot provider forces
# an interactive device flow). SSE + tool_use on THIS wire: unverified.
# Path shapes (W935): /v1/messages + /v1/responses are served WITH /v1;
# chat completions is NOT — /chat/completions (W684 verified live). The
# openai rows carry adapter_config.path_rewrite to match; buckle forwards
# unlisted paths verbatim.
#
# Group name = the wire id lanes send; `model:` = the seat's real id.
# Claude groups keep their existing dash aliases. Other models use catalog ids.
version: 1

groups:
  claude-sonnet-5:
    - &copilot
      url: https://api.githubcopilot.com
      dialect: anthropic
      adapter: anthropic
      api_key_env: GITHUB_COPILOT_PAT
      model: claude-sonnet-5
      visibility: spoke-private
      adapter_config:
        headers:
          copilot-integration-id: vscode-chat
  claude-opus-5-5:
    - <<: *copilot
      model: claude-opus-5.5
  claude-haiku-4-5:
    - <<: *copilot
      model: claude-haiku-4.5
  # the 5.5 generations under their own names
  claude-sonnet-5-5:
    - <<: *copilot
      model: claude-sonnet-5.5
  claude-haiku-5-5:
    - <<: *copilot
      model: claude-haiku-5.5
  claude-opus-4-8:
    - <<: *copilot
      model: claude-opus-4.8
  claude-opus-5:
    - <<: *copilot
      model: claude-opus-5
  # W912 — Responses-API-only rows: the catalog marks gpt-5.3-codex and most
  # GPT models /responses-only. These ride POST /v1/responses (bare or
  # /w/<sid>-prefixed): buckle forwards the ingress path VERBATIM on
  # openai-dialect rows, and the bridge NEVER re-targets a /v1/responses leg
  # at chat completions. Group name = the wire id (no dots here, so no
  # dots-to-dashes alias is needed).
  gpt-5.3-codex:
    - <<: *copilot
      dialect: openai
      adapter: openai-compat
      model: gpt-5.3-codex

  # Selectable Copilot catalog models. Endpoint shape follows supported_endpoints.
  # W935: chat completions lives at /chat/completions (NO /v1) on this
  # provider — the path_rewrite knob moves only the pathname; /v1/responses
  # is served WITH /v1 and stays verbatim. Anthropic rows keep /v1/messages
  # as-is (served with /v1).
  gemini-3.7-flash:
    - &copilot-openai
      url: https://api.githubcopilot.com
      dialect: openai
      adapter: openai-compat
      api_key_env: GITHUB_COPILOT_PAT
      model: gemini-3.7-flash
      visibility: spoke-private
      adapter_config:
        path_rewrite: {"/v1/chat/completions": "/chat/completions"}
        headers:
          copilot-integration-id: vscode-chat
  gemini-3.8-flash:
    - <<: *copilot-openai
      model: gemini-3.8-flash
  gemini-4-argon:
    - <<: *copilot-openai
      model: gemini-4-argon
  gpt-5.4-mini:
    - <<: *copilot-openai
      model: gpt-5.4-mini
  gpt-5.4:
    - <<: *copilot-openai
      model: gpt-5.4
  gpt-5.5:
    - <<: *copilot-openai
      model: gpt-5.5
  gpt-5.6-luna:
    - <<: *copilot-openai
      model: gpt-5.6-luna
  gpt-5.6-sol:
    - <<: *copilot-openai
      model: gpt-5.6-sol
  gpt-5.6-terra:
    - <<: *copilot-openai
      model: gpt-5.6-terra
  gpt-6.1-sol:
    - <<: *copilot-openai
      model: gpt-6.1-sol
  gpt-6-astra:
    - <<: *copilot-openai
      model: gpt-6-astra
  gpt-6-luna:
    - <<: *copilot-openai
      model: gpt-6-luna
  gpt-6-sol:
    - <<: *copilot-openai
      model: gpt-6-sol
  grok-4.5:
    - <<: *copilot-openai
      model: grok-4.5
  grok-4.6:
    - <<: *copilot-openai
      model: grok-4.6
  grok-4.7:
    - <<: *copilot-openai
      model: grok-4.7
  mai-code-1.1-flash:
    - <<: *copilot-openai
      model: mai-code-1.1-flash
  gpt-5-mini:
    - <<: *copilot-openai
      model: gpt-5-mini
