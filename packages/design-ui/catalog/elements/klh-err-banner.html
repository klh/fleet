106,0,.10);--klh-warm:#f8efe4;--klh-danger:#af2f12;--klh-danger-ink:#a3361a;--klh-danger-bg:#fbe9e4;--klh-danger-edge:rgba(175,47,18,.5);--klh-danger-wash:rgba(175,47,18,.10);--klh-ok:#5c7a35;--klh-ok-ink:#3f6a1c;--klh-ok-hi:#35591a;--klh-ok-bg:#eaf3e0;--klh-ok-wash:rgba(92,122,53,.14);--klh-info:#2f7a68;--klh-wash:rgba(0,0,0,.025);--klh-edge-faint:rgba(0,0,0,.07);--klh-edge-soft:rgba(0,0,0,.10);--klh-edge:rgba(0,0,0,.13);--klh-edge-mid:rgba(0,0,0,.18);--klh-edge-strong:rgba(0,0,0,.24);--klh-edge-hover:rgba(0,0,0,.4);--klh-rule:#e2dfd8;--klh-shadow:rgba(0,0,0,.14);--klh-chart-grid:#e2dfd8;--klh-chart-hair:#cfcbc2;--klh-chart-axis:#6b675f;--klh-accent-dim:rgba(168,106,0,.40);--klh-ent-accent:#6b5ca5;--klh-ent-accent-bg:#efecf6;--klh-ent-accent-wash:rgba(107,92,165,.10);--klh-ent-edge:rgba(107,92,165,.35);}@media (prefers-color-scheme: light){:root:not([data-theme]){color-scheme:light;--klh-bg:#f6f4ef;--klh-field:#ffffff;--klh-panel:#fbfaf7;--klh-surface:#ffffff;--klh-overlay:#ffffff;--klh-surface-hi:#ece9e2;--klh-ink:#1c1b19;--klh-ink-2:#3b3934;--klh-ink-3:#55524b;--klh-dim:#6b675f;--klh-accent:#a86a00;--klh-on-accent:#ffffff;--klh-accent-bg:#fbf1dc;--klh-accent-wash:rgba(168,106,0,.10);--klh-warm:#f8efe4;--klh-danger:#af2f12;--klh-danger-ink:#a3361a;--klh-danger-bg:#fbe9e4;--klh-danger-edge:rgba(175,47,18,.5);--klh-danger-wash:rgba(175,47,18,.10);--klh-ok:#5c7a35;--klh-ok-ink:#3f6a1c;--klh-ok-hi:#35591a;--klh-ok-bg:#eaf3e0;--klh-ok-wash:rgba(92,122,53,.14);--klh-info:#2f7a68;--klh-wash:rgba(0,0,0,.025);--klh-edge-faint:rgba(0,0,0,.07);--klh-edge-soft:rgba(0,0,0,.10);--klh-edge:rgba(0,0,0,.13);--klh-edge-mid:rgba(0,0,0,.18);--klh-edge-strong:rgba(0,0,0,.24);--klh-edge-hover:rgba(0,0,0,.4);--klh-rule:#e2dfd8;--klh-shadow:rgba(0,0,0,.14);--klh-chart-grid:#e2dfd8;--klh-chart-hair:#cfcbc2;--klh-chart-axis:#6b675f;--klh-accent-dim:rgba(168,106,0,.40);--klh-ent-accent:#6b5ca5;--klh-ent-accent-bg:#efecf6;--klh-ent-accent-wash:rgba(107,92,165,.10);--klh-ent-edge:rgba(107,92,165,.35);}}</style>
<style>
.pair {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: var(--klh-space-3);
}
.pair section {
	border: var(--klh-line-hair) solid var(--klh-edge);
	padding: var(--klh-space-3);
	background: var(--klh-panel);
}
.pair h2 {
	font: 700 var(--klh-text-sm)/1.2 var(--klh-font-sans);
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var(--klh-dim);
	margin: 0 0 var(--klh-space-2);
}
section[data-theme="light"] {
	color-scheme: light;
	background: var(--klh-surface);
}

.proto-err {
	color: var(--klh-danger-ink);
	background: var(--klh-danger-bg);
	padding: var(--klh-space-1) var(--klh-space-2);
	font: var(--klh-text-sm)/1.4 var(--klh-font-sans);
}
.proto-retry {
	background: none;
	border: var(--klh-line-hair) solid var(--klh-danger);
	color: var(--klh-danger-ink);
	padding: var(--klh-space-3);
	margin-left: var(--klh-space-3);
	cursor: pointer;
}

.proto-conn {
	color: var(--klh-dim);
	font: var(--klh-text-sm)/1.4 var(--klh-font-sans);
	margin: 0;
}
.proto-dot {
	display: inline-block;
	width: var(--klh-space-3);
	height: var(--klh-space-3);
	border-radius: 50%;
	margin-right: var(--klh-space-2);
	background: var(--klh-ok);
}

.proto-dim {
	color: var(--klh-dim);
}
.proto-row {
	font: var(--klh-text-md)/1.4 var(--klh-font-sans);
	color: var(--klh-ink);
}
.proto-badge {
	font-weight: 700;
	color: var(--klh-ok-ink);
}
.proto-name {
	font-weight: 600;
}
.proto-detail {
	color: var(--klh-dim);
	margin: var(--klh-space-1) 0 0;
}
</style>
</head>
<body>
<main>
<h1>klh-err-banner</h1>
<p class="why">Inline feed-failure banner — retry dispatches FeedRefreshRequestedEvent (feed) or ErrorDismissRequestedEvent (local).</p>
<div class="pair">
<section data-pane="prototype">
<h2>Prototype (native HTML)</h2>
<div class="proto-err" role="alert">feed /api/data failed: 502 upstream<button class="proto-retry" type="button">retry</button></div>
</section>
<section data-pane="component">
<h2>Component (Lit)</h2>
<klh-err-banner></klh-err-banner>
</section>
</div>
</main>
<script type="module" src="./klh-err-banner.js"></script>
<script></script>
</body>
</html>
