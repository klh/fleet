# LiteLLM proxy config TEMPLATE — the :4100 cloud gateway engine.
# The engine is supervisor-OWNED: belt/bin/litellm-target.ts spawns
#   litellm --host 127.0.0.1 --config ~/.claude/local-llm/litellm.yaml --port 4100
# (LITELLM_PORT, litellm-target.ts:22). The real config is machine-level
# (config-over-code); this file only shows the shape. The model_list is
# GENERATED — never hand-maintain it:
#   bun bin/registry-emit.ts litellm   # from bin/registry.ts (chat rows)
model_list:
  - model_name: local-coder # registry alias (bin/registry.ts)
    litellm_params:
      model: openai/<mlx-community-model-id>
      api_base: http://127.0.0.1:8901/v1
      api_key: local
  - model_name: local-reason
    litellm_params:
      model: openai/<mlx-community-model-id>
      api_base: http://127.0.0.1:8903/v1
      api_key: local

litellm_settings:
  drop_params: true # tolerate Anthropic-only params the fleet ignores
