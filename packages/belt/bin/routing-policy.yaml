# Belt routing policy — LiteLLM-router config. The single policy file:
# bin/router-policy.ts loads it, bin/gateway-config.ts emits the `gateway`
# section as router_settings into the private litellm.yaml, and the ladders
# as litellm_settings.fallbacks (W219.2: the placement the installed litellm
# actually reads — pinned-source verified, proxy_server.py setattr default +
# router.py `_fallbacks = fallbacks or litellm.fallbacks`;
# router_settings.model_group_fallbacks is NOT a key the proxy knows and is
# ignored with a warning — the 2026-10-06 z.ai TLS outage hard-failed lanes
# that way).
#
# OWNER DIRECTIVES (lesson.fanout-rate-budget + the 2026-10-04/06 hand-edit
# fold, W219.2): the 429 wall proved glm groups need cross-group ladders to
# the zai twins + local-reason; the TLS outage proved they must be live
# (placement law above). NEVER flashx — same upstream family saturates
# together, and flashx is too expensive.
#   - operators edit THIS FILE — never code. Runtime copy
#     ~/.claude/local-llm/routing-policy.yaml beats the committed default;
#     BELT_POLICY env beats both.
#
# ACTIVATION (coordinator step, BETWEEN fan-outs — a config reload drops
# in-flight streams):
#   bun bin/gateway-config.ts
#   kill $(lsof -ti tcp:4100 -sTCP:LISTEN)   # swarm supervisor respawns :4100 (W277)
#
# BUDGETS: per-key/per-group rpm/tpm + spend budgets are ALSO native
# (virtual keys + parallel_request_limiter) but need Postgres (DATABASE_URL)
# — documented activation step, deliberately not built in this lane. Until
# then the proactive tier is the operator cap: keep fan-outs ≤ ~6 concurrent
# flash lanes (lesson.fanout-rate-budget).
version: 1

gateway:
  num_retries: 1
  allowed_fails: 3
  cooldown_time: 30
  # Background /health loop (W886, W499 surface 3): cached probes every
  # 300s instead of per-call health cost; dormant key-gated rows opt out
  # per-deployment (gateway-config emits model_info.disable_background_
  # health_check for them).
  litellm_health_checks: true
  # Ordered cross-group ladders (tried after num_retries): glm group →
  # openai-dialect zai twin → local-reason. When z.ai is dark both z.ai
  # rungs fail and local-reason answers — the drill in llm-keepwarm.ts
  # (fallback-drill.ts) asserts exactly this every 4 min.
  fallbacks:
    glm-5.3-flash: [zai-glm-5.3-flash, local-reason]
    glm-5.3: [zai-glm-5.3, local-reason]
    glm-5.2: [zai-glm-5.2, local-reason]

# Direct-tier bypass (W270) — hot local classes skip the LiteLLM hop.
# Bench 2026-10-02 (REPORT.md): litellm on local = 1.35-3.92× wall vs the
# same :890x port direct (+0.5-2.2 s TTFT). Clients resolve a model alias
# with resolveTarget() (bin/router-policy.ts); gateway-config emits the map
# to ~/.claude/local-llm/direct-tiers.json for non-TS consumers.
# EMITTED-ONLY (W289): the tier map is no longer hand-written here —
# registry-emit `direct` generates the rows from bin/registry.ts (parseDirect
# accepts the emitted {url: ...} shape and the legacy alias:<url> strings).
# On-demand :8906 (local-general) stays behind the gateway: it may be cold,
# and the gateway/router own spawn + fallback.

# ─── role-class routing (W648, oh-my-codex §1 lift) ───
# Declarative class rows: dispatch/Task pins name a CLASS, the ladder inside
# it resolves the concrete group — buckle/litellm keep resolving group →
# provider natively (groups are the existing belt-facing alias namespace:
# litellm model_name / buckle group / direct-tier key). The `-low` suffix on
# any role or lane name drops to the cheap lane with NO registry edit; the
# explicit `roles:` map wins over the suffix. Reasoning effort is a
# SEPARATE, model-independent axis: role row > class row > default (low..
# xhigh), passed through buckle as reasoning_effort (W770: buckle forwards
# it verbatim on translated hops and belt escalate pins it — Z.AI-verified
# values only, low|high clamp, GLM-5.3 always thinks, medium/disable 400;
# zai rows forward via allowed_openai_params; MLX effort = the router
# budget policy).
classes:
  frontier: [glm-5.3]
  standard: [glm-5.3-flash]
  spark: [local-extract, local-coder]
roles: {}
reasoning:
  default: medium
  classes:
    spark: low
  roles: {}
